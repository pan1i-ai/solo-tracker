<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOLO">
<title>SOLO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050506;
  --glass:rgba(35,35,38,.62);
  --glass2:rgba(48,48,52,.48);
  --stroke:rgba(255,255,255,.10);
  --text:#f7f7f8;
  --muted:#97979f;
  --accent:#d8ff3f;
  --danger:#ff6b6b;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  background:
    radial-gradient(circle at 15% -10%,rgba(216,255,63,.08),transparent 32%),
    radial-gradient(circle at 100% 20%,rgba(90,100,255,.09),transparent 35%),
    var(--bg);
  color:var(--text);
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
}

body{
  padding:0;
}

button,input,textarea{
  font:inherit;
}

.app{
  width:min(650px,100%);
  margin:auto;
  min-height:100vh;
  padding:
    calc(20px + env(safe-area-inset-top))
    16px
    calc(105px + env(safe-area-inset-bottom));
}

.top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin:4px 4px 28px;
}

.brand{
  font-size:13px;
  font-weight:800;
  letter-spacing:.2em;
  color:var(--accent);
}

h1{
  font-size:34px;
  line-height:1;
  letter-spacing:-.045em;
  margin:6px 0 0;
}

h2{
  font-size:25px;
  letter-spacing:-.035em;
  margin:0;
}

.muted{
  color:var(--muted);
}

.cloud{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#777;
}

.dot.ok{
  background:var(--accent);
  box-shadow:0 0 10px rgba(216,255,63,.45);
}

.glass{
  background:var(--glass);
  border:1px solid var(--stroke);
  backdrop-filter:blur(28px) saturate(140%);
  -webkit-backdrop-filter:blur(28px) saturate(140%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.06),
    0 12px 40px rgba(0,0,0,.20);
}

.hero{
  border-radius:32px;
  padding:24px;
}

.hero-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:16px;
}

.weight{
  font-size:58px;
  line-height:1;
  font-weight:750;
  letter-spacing:-.065em;
}

.weight span{
  color:var(--muted);
  font-size:20px;
  font-weight:500;
  letter-spacing:0;
}

.goal{
  text-align:right;
}

.goal b{
  display:block;
  font-size:25px;
}

.goal small{
  color:var(--muted);
}

.divider{
  height:1px;
  background:var(--stroke);
  margin:22px 0;
}

.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.metric{
  background:var(--glass2);
  border:1px solid var(--stroke);
  border-radius:21px;
  padding:15px;
}

.metric small{
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}

.metric b{
  font-size:19px;
}

.journal-preview{
  margin-top:18px;
  color:#d5d5d9;
  line-height:1.45;
  font-size:14px;
}

.primary{
  width:100%;
  border:0;
  border-radius:19px;
  padding:17px;
  margin-top:12px;
  background:var(--accent);
  color:#101105;
  font-weight:750;
  font-size:16px;
}

.secondary{
  width:100%;
  border:1px solid var(--stroke);
  border-radius:18px;
  padding:15px;
  background:var(--glass2);
  color:var(--text);
  font-weight:650;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 4px 13px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

.summary{
  border-radius:20px;
  padding:15px 12px;
  text-align:center;
}

.summary b{
  display:block;
  font-size:18px;
}

.summary small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}

.chart-card{
  border-radius:28px;
  padding:18px;
  overflow:hidden;
}

.chart{
  width:100%;
  height:190px;
  display:block;
}

.chart-empty{
  height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--muted);
}

.history-item{
  border-radius:25px;
  padding:18px;
  margin-bottom:10px;
  cursor:pointer;
}

.history-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.history-weight{
  font-size:21px;
  font-weight:700;
}

.history-data{
  display:flex;
  gap:14px;
  margin-top:10px;
  color:var(--muted);
  font-size:13px;
}

.history-note{
  margin-top:13px;
  color:#d3d3d6;
  line-height:1.4;
  font-size:14px;
  white-space:pre-wrap;
}

nav{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:calc(10px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(430px,calc(100% - 28px));
  height:67px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  padding:7px;
  border-radius:28px;
  background:rgba(38,38,42,.66);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(30px) saturate(160%);
  -webkit-backdrop-filter:blur(30px) saturate(160%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08),
    0 14px 40px rgba(0,0,0,.35);
}

nav button{
  border:0;
  background:transparent;
  color:#8d8d94;
  border-radius:21px;
  font-size:11px;
  font-weight:600;
}

nav button span{
  display:block;
  font-size:22px;
  margin-bottom:2px;
}

nav button.active{
  background:rgba(255,255,255,.09);
  color:var(--accent);
}

dialog{
  width:min(600px,calc(100% - 16px));
  max-height:90vh;
  overflow:auto;
  padding:0;
  border:1px solid rgba(255,255,255,.12);
  border-radius:32px;
  background:rgba(24,24,27,.88);
  color:var(--text);
  backdrop-filter:blur(35px) saturate(160%);
  -webkit-backdrop-filter:blur(35px) saturate(160%);
}

dialog::backdrop{
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(4px);
}

.sheet{
  padding:22px;
}

.sheet-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.close{
  width:35px;
  height:35px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  color:white;
  font-size:20px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:13px;
}

input,textarea{
  display:block;
  width:100%;
  margin-top:6px;
  border:1px solid var(--stroke);
  border-radius:17px;
  background:rgba(255,255,255,.06);
  color:white;
  padding:15px;
  outline:none;
  font-size:17px;
}

input:focus,textarea:focus{
  border-color:rgba(216,255,63,.5);
}

textarea{
  min-height:150px;
  resize:vertical;
  line-height:1.45;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 10px;
}

.full{
  grid-column:1/-1;
}

.auth{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 20% 10%,rgba(216,255,63,.08),transparent 35%),
    #050506;
  padding:20px;
}

.auth.hidden{
  display:none;
}

.auth-card{
  width:min(420px,100%);
  padding:24px;
  border-radius:32px;
}

.auth-card h2{
  margin:8px 0 6px;
  font-size:29px;
}

.auth-card p{
  margin:0 0 20px;
}

.auth-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.auth-msg{
  color:var(--muted);
  margin-top:13px;
  min-height:18px;
  font-size:12px;
  line-height:1.4;
}

.signout{
  border:0;
  background:none;
  color:var(--muted);
  padding:0;
  font-size:12px;
  margin-top:9px;
}

@media(max-width:380px){
  .weight{
    font-size:51px;
  }

  .summary-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div id="auth" class="auth">
  <div class="auth-card glass">

    <div class="brand">SOLO</div>
    <h2>Вход</h2>

    <p class="muted">
      Твои записи синхронизируются через облако.
    </p>

    <label>
      Email
      <input id="email" type="email" autocomplete="email">
    </label>

    <label>
      Пароль
      <input id="password" type="password" autocomplete="current-password">
    </label>

    <div class="auth-actions">
      <button class="primary" onclick="login()">Войти</button>
      <button class="secondary" onclick="signup()">Регистрация</button>
    </div>

    <div id="authMsg" class="auth-msg"></div>

  </div>
</div>


<div class="app">

  <header class="top">

    <div>
      <div class="brand">SOLO</div>
      <h1 id="pageTitle">Сегодня</h1>
    </div>

    <div>
      <div class="cloud">
        <span id="cloudDot" class="dot"></span>
        <span id="cloudText">Облако</span>
      </div>

      <button class="signout" onclick="logout()">Выйти</button>
    </div>

  </header>


  <section id="todayScreen" class="screen active">

    <div class="hero glass">

      <div class="hero-top">

        <div>
          <div class="muted">Текущий вес</div>
          <div id="mainWeight" class="weight">
            — <span>кг</span>
          </div>
        </div>

        <div class="goal">
          <b id="toGoal">—</b>
          <small>до цели</small>
        </div>

      </div>

      <div class="divider"></div>

      <div class="metrics">

        <div class="metric">
          <small>Калории сегодня</small>
          <b id="todayCalories">—</b>
        </div>

        <div class="metric">
          <small>Белок сегодня</small>
          <b id="todayProtein">—</b>
        </div>

      </div>

      <div id="todayJournal" class="journal-preview muted">
        Сегодня ещё нет записи.
      </div>

    </div>

    <button class="primary" onclick="editDay()">
      Записать день
    </button>

  </section>


  <section id="progressScreen" class="screen">

    <div class="chart-card glass">
      <div id="chartArea"></div>
    </div>

    <div class="summary-grid">

      <div class="summary glass">
        <b id="delta7">—</b>
        <small>вес за период</small>
      </div>

      <div class="summary glass">
        <b id="avgCalories">—</b>
        <small>средние ккал</small>
      </div>

      <div class="summary glass">
        <b id="avgProtein">—</b>
        <small>средний белок</small>
      </div>

    </div>

  </section>


  <section id="historyScreen" class="screen">

    <div id="history"></div>

  </section>

</div>


<nav>

  <button
    class="active"
    onclick="showScreen('today',this)">
    <span>●</span>
    Сегодня
  </button>

  <button
    onclick="showScreen('progress',this)">
    <span>⌁</span>
    Прогресс
  </button>

  <button
    onclick="showScreen('history',this)">
    <span>≡</span>
    История
  </button>

</nav>


<dialog id="editor">

  <div class="sheet">

    <div class="sheet-top">

      <div>
        <div class="brand">ЗАПИСЬ</div>
        <h2>День</h2>
      </div>

      <button
        class="close"
        onclick="$('editor').close()">
        ×
      </button>

    </div>


    <form id="form">

      <label class="full">
        Дата
        <input id="logDate" type="date" required>
      </label>


      <div class="form-grid">

        <label>
          Вес, кг
          <input
            id="weight"
            type="number"
            inputmode="decimal"
            step=".1"
            placeholder="Например 84.6">
        </label>


        <label>
          Калории
          <input
            id="calories"
            type="number"
            inputmode="numeric"
            placeholder="Например 2100">
        </label>


        <label class="full">
          Белок, г
          <input
            id="protein"
            type="number"
            inputmode="numeric"
            placeholder="Например 130">
        </label>


        <label class="full">
          Дневник дня
          <textarea
            id="journal"
            placeholder="Пиши свободно. Например: спал 6 часов, утром тяжело проснулся, выпил 2 энергетика, вечером тренировался 40 минут, ел рис с курицей..."></textarea>
        </label>

      </div>

      <button class="primary" type="submit">
        Сохранить
      </button>

    </form>

  </div>

</dialog>


<script>

const SUPABASE_URL =
'https://uxogvikvlqemyletowfc.supabase.co';

const SUPABASE_KEY =
'sb_publishable_Osjd2rvBr2l3ogBLndVzhQ_vD3kcnfj';

const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const GOAL_WEIGHT = 80;

let user = null;
let logs = [];

const $ = id =>
document.getElementById(id);


function localDate(){

  const d = new Date();

  const y = d.getFullYear();

  const m =
  String(d.getMonth()+1)
  .padStart(2,'0');

  const day =
  String(d.getDate())
  .padStart(2,'0');

  return `${y}-${m}-${day}`;

}


function formatDate(date){

  return new Date(
    date + 'T12:00:00'
  )
  .toLocaleDateString(
    'ru-RU',
    {
      day:'numeric',
      month:'long'
    }
  );

}


function escapeHtml(text){

  const d =
  document.createElement('div');

  d.textContent =
  text || '';

  return d.innerHTML;

}


function cloud(text,ok){

  $('cloudText').textContent =
  text;

  $('cloudDot')
  .classList
  .toggle(
    'ok',
    !!ok
  );

}


function normalize(row){

  return {
    date:row.log_date,
    weight:
      row.weight === null
      ? null
      : Number(row.weight),
    calories:
      Number(row.calories) || 0,
    protein:
      Number(row.protein) || 0,
    journal:
      row.note || ''
  };

}


async function loadCloud(){

  if(!user)
  return;

  cloud(
    'Синхронизация',
    false
  );


  const {
    data,
    error
  } =
  await sb
  .from('daily_logs')
  .select(
    'log_date,weight,calories,protein,note'
  )
  .order(
    'log_date',
    {ascending:true}
  );


  if(error){

    console.error(error);

    cloud(
      'Ошибка',
      false
    );

    loadCache();

    render();

    return;

  }


  logs =
  (data || [])
  .map(normalize);


  localStorage.setItem(
    'solo_v3_cache',
    JSON.stringify(logs)
  );


  cloud(
    'Синхронизировано',
    true
  );

  render();

}


function loadCache(){

  try{

    logs =
    JSON.parse(
      localStorage
      .getItem(
        'solo_v3_cache'
      ) || '[]'
    );

  }catch{

    logs = [];

  }

}


async function saveDay(log){

  if(!user)
  return;


  cloud(
    'Сохраняю',
    false
  );


  const payload = {

    user_id:
    user.id,

    log_date:
    log.date,

    weight:
    log.weight,

    calories:
    log.calories,

    protein:
    log.protein,

    note:
    log.journal,

    drinks:0,
    water:0,
    cardio:0,

    pushups:[
      0,0,0,0
    ],

    squats:[
      0,0,0,0
    ],

    mood:null,
    energy:null,

    workout_text:''

  };


  const {
    error
  } =
  await sb
  .from('daily_logs')
  .upsert(
    payload,
    {
      onConflict:
      'user_id,log_date'
    }
  );


  if(error){

    console.error(error);

    cloud(
      'Ошибка сохранения',
      false
    );

    alert(
      'Не удалось сохранить запись в облако.'
    );

    return;

  }


  await loadCloud();

}


function findDate(date){

  return logs.find(
    x => x.date === date
  );

}


function latestWeight(){

  return [...logs]
  .reverse()
  .find(
    x => x.weight
  )
  ?.weight || null;

}


function renderToday(){

  const today =
  findDate(
    localDate()
  );


  const weight =
  latestWeight();


  $('mainWeight')
  .innerHTML =
  weight
  ?
  `${weight.toFixed(1)} <span>кг</span>`
  :
  `— <span>кг</span>`;


  $('toGoal')
  .textContent =
  weight
  ?
  Math.max(
    0,
    weight-GOAL_WEIGHT
  )
  .toFixed(1) + ' кг'
  :
  '—';


  $('todayCalories')
  .textContent =
  today?.calories
  ?
  `${today.calories} ккал`
  :
  '—';


  $('todayProtein')
  .textContent =
  today?.protein
  ?
  `${today.protein} г`
  :
  '—';


  $('todayJournal')
  .textContent =
  today?.journal
  ?
  today.journal
  :
  'Сегодня ещё нет записи.';

}


function renderProgress(){

  const period =
  [...logs]
  .slice(-14);


  const weighted =
  period.filter(
    x => x.weight
  );


  drawChart(
    weighted
  );


  if(
    weighted.length >= 2
  ){

    const delta =
    weighted.at(-1).weight -
    weighted[0].weight;


    $('delta7')
    .textContent =
    `${delta>0?'+':''}${delta.toFixed(1)} кг`;

  }else{

    $('delta7')
    .textContent =
    '—';

  }


  const kcal =
  period.filter(
    x => x.calories
  );


  $('avgCalories')
  .textContent =
  kcal.length
  ?
  Math.round(
    kcal.reduce(
      (a,b) =>
      a+b.calories,
      0
    ) /
    kcal.length
  )
  :
  '—';


  const protein =
  period.filter(
    x => x.protein
  );


  $('avgProtein')
  .textContent =
  protein.length
  ?
  Math.round(
    protein.reduce(
      (a,b) =>
      a+b.protein,
      0
    ) /
    protein.length
  ) + ' г'
  :
  '—';

}


function drawChart(data){

  if(
    data.length < 2
  ){

    $('chartArea')
    .innerHTML =
    '<div class="chart-empty">Нужно минимум 2 замера веса</div>';

    return;

  }


  const values =
  data.map(
    x => x.weight
  );


  let min =
  Math.min(...values);

  let max =
  Math.max(...values);


  if(min === max){

    min -= 1;
    max += 1;

  }


  const W = 500;
  const H = 180;
  const PAD = 15;


  const points =
  data.map(
    (x,i) => {

      const px =
      PAD +
      (
        (W-PAD*2) *
        i /
        (data.length-1)
      );


      const py =
      H-PAD -
      (
        (x.weight-min) /
        (max-min)
      ) *
      (H-PAD*2);


      return [
        px.toFixed(1),
        py.toFixed(1)
      ];

    }
  );


  const poly =
  points
  .map(
    p => p.join(',')
  )
  .join(' ');


  const dots =
  points
  .map(
    p =>
    `<circle
      cx="${p[0]}"
      cy="${p[1]}"
      r="4"
      fill="#d8ff3f"/>`
  )
  .join('');


  $('chartArea')
  .innerHTML = `

  <svg
    class="chart"
    viewBox="0 0 ${W} ${H}"
    preserveAspectRatio="none">

    <defs>

      <linearGradient
        id="fill"
        x1="0"
        y1="0"
        x2="0"
        y2="1">

        <stop
          offset="0%"
          stop-color="#d8ff3f"
          stop-opacity=".20"/>

        <stop
          offset="100%"
          stop-color="#d8ff3f"
          stop-opacity="0"/>

      </linearGradient>

    </defs>


    <polygon
      points="
      ${points[0][0]},${H}
      ${poly}
      ${points.at(-1)[0]},${H}"
      fill="url(#fill)"/>


    <polyline
      points="${poly}"
      fill="none"
      stroke="#d8ff3f"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    ${dots}

  </svg>

  <div
    style="
      display:flex;
      justify-content:space-between;
      color:#97979f;
      font-size:11px;
      margin-top:5px">

    <span>
      ${formatDate(data[0].date)}
    </span>

    <span>
      ${formatDate(data.at(-1).date)}
    </span>

  </div>

  `;

}


function renderHistory(){

  if(!logs.length){

    $('history')
    .innerHTML =
    '<div class="muted">Записей пока нет.</div>';

    return;

  }


  $('history')
  .innerHTML =
  [...logs]
  .reverse()
  .map(
    x => {

      const journal =
      x.journal
      ?
      escapeHtml(x.journal)
      :
      'Без заметки';


      return `

      <div
        class="history-item glass"
        onclick="editDay('${x.date}')">

        <div class="history-top">

          <b>
            ${formatDate(x.date)}
          </b>

          <div class="history-weight">
            ${
              x.weight
              ?
              x.weight.toFixed(1)+' кг'
              :
              '—'
            }
          </div>

        </div>


        <div class="history-data">

          <span>
            ${
              x.calories
              ?
              x.calories+' ккал'
              :
              'ккал —'
            }
          </span>

          <span>
            ${
              x.protein
              ?
              x.protein+' г белка'
              :
              'белок —'
            }
          </span>

        </div>


        <div class="history-note">
          ${journal}
        </div>

      </div>

      `;

    }
  )
  .join('');

}


function render(){

  renderToday();
  renderProgress();
  renderHistory();

}


function editDay(
  date = localDate()
){

  const log =
  findDate(date);


  $('logDate').value =
  date;


  $('weight').value =
  log?.weight ?? '';


  $('calories').value =
  log?.calories || '';


  $('protein').value =
  log?.protein || '';


  $('journal').value =
  log?.journal || '';


  $('editor')
  .showModal();

}


$('form')
.addEventListener(
  'submit',
  async event => {

    event.preventDefault();


    const log = {

      date:
      $('logDate').value,

      weight:
      $('weight').value
      ?
      Number(
        $('weight').value
      )
      :
      null,

      calories:
      Number(
        $('calories').value
      ) || 0,

      protein:
      Number(
        $('protein').value
      ) || 0,

      journal:
      $('journal')
      .value
      .trim()

    };


    $('editor')
    .close();


    await saveDay(log);

  }
);


function showScreen(
  name,
  btn
){

  const map = {
    today:[
      'todayScreen',
      'Сегодня'
    ],
    progress:[
      'progressScreen',
      'Прогресс'
    ],
    history:[
      'historyScreen',
      'История'
    ]
  };


  document
  .querySelectorAll(
    '.screen'
  )
  .forEach(
    s =>
    s.classList.remove(
      'active'
    )
  );


  $(map[name][0])
  .classList
  .add('active');


  $('pageTitle')
  .textContent =
  map[name][1];


  document
  .querySelectorAll(
    'nav button'
  )
  .forEach(
    b =>
    b.classList.remove(
      'active'
    )
  );


  btn
  .classList
  .add('active');


  if(name === 'progress'){

    renderProgress();

  }

}


function authMessage(
  text,
  error=false
){

  $('authMsg')
  .textContent =
  text;


  $('authMsg')
  .style
  .color =
  error
  ?
  'var(--danger)'
  :
  'var(--muted)';

}


async function login(){

  const email =
  $('email')
  .value
  .trim();


  const password =
  $('password')
  .value;


  const {
    data,
    error
  } =
  await sb.auth
  .signInWithPassword({
    email,
    password
  });


  if(error){

    authMessage(
      error.message,
      true
    );

    return;

  }


  user =
  data.user;


  $('auth')
  .classList
  .add('hidden');


  await loadCloud();

}


async function signup(){

  const email =
  $('email')
  .value
  .trim();


  const password =
  $('password')
  .value;


  if(
    !email ||
    password.length < 6
  ){

    authMessage(
      'Укажи email и пароль минимум из 6 символов.',
      true
    );

    return;

  }


  const {
    data,
    error
  } =
  await sb.auth
  .signUp({
    email,
    password
  });


  if(error){

    authMessage(
      error.message,
      true
    );

    return;

  }


  if(data.session){

    user =
    data.user;

    $('auth')
    .classList
    .add('hidden');

    await loadCloud();

  }else{

    authMessage(
      'Подтверди email через письмо и затем войди.'
    );

  }

}


async function logout(){

  await sb.auth
  .signOut();

  user = null;
  logs = [];

  $('auth')
  .classList
  .remove('hidden');

  cloud(
    'Нет входа',
    false
  );

}


async function init(){

  loadCache();
  render();


  const {
    data:{
      session
    }
  } =
  await sb.auth
  .getSession();


  if(session?.user){

    user =
    session.user;

    $('auth')
    .classList
    .add('hidden');

    await loadCloud();

  }else{

    cloud(
      'Нет входа',
      false
    );

  }

}


init();

</script>

</body>
</html>
