<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SOLO">
<title>SOLO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  color-scheme:dark;--bg:#050505;--panel:rgba(30,30,30,.62);
  --soft:rgba(255,255,255,.065);--stroke:rgba(255,255,255,.13);
  --strong:rgba(255,255,255,.22);--text:#f7f7f5;--muted:#9c9c98;
  --dim:#70706d;--white:#fff;--black:#070707;--danger:#ff8179;
  --shadow:0 24px 70px rgba(0,0,0,.42)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{
  min-height:100vh;margin:0;overflow-x:hidden;color:var(--text);
  background:
    radial-gradient(circle at 12% -8%,rgba(255,255,255,.13),transparent 30rem),
    radial-gradient(circle at 105% 24%,rgba(255,255,255,.075),transparent 27rem),
    linear-gradient(180deg,#090909 0%,#030303 100%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{
  width:min(680px,100%);min-height:100vh;margin:0 auto;
  padding:calc(20px + env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom))
}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin:4px 4px 24px}
.brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
.brand::before{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 20px rgba(255,255,255,.7);content:""}
h1,h2,p{margin:0}
h1{margin-top:7px;font-size:clamp(33px,8vw,44px);line-height:.98;letter-spacing:-.055em}
h2{font-size:27px;letter-spacing:-.04em}
.muted{color:var(--muted)}
.account{display:flex;align-items:flex-end;flex-direction:column;gap:7px}
.cloud{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--muted);font-size:11px;white-space:nowrap}
.cloud-dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.cloud-dot.ok{background:#fff;box-shadow:0 0 12px rgba(255,255,255,.7)}
.signout{border:0;padding:0;background:transparent;color:var(--dim);font-size:12px}
.glass{
  border:1px solid var(--stroke);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025)),var(--panel);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--shadow);
  backdrop-filter:blur(30px) saturate(125%);-webkit-backdrop-filter:blur(30px) saturate(125%)
}
.screen{display:none;animation:screen-in .26s ease both}.screen.active{display:block}
@keyframes screen-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.hero{position:relative;min-height:410px;overflow:hidden;border-radius:34px;padding:25px;isolation:isolate}
.hero::after{
  position:absolute;inset:auto -95px -130px auto;z-index:-2;width:350px;height:350px;
  border-radius:50%;background:rgba(255,255,255,.09);filter:blur(55px);content:""
}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr) 185px;align-items:start;gap:8px;min-height:236px}
.hero-copy{position:relative;z-index:2;padding-top:3px}
.eyebrow{color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.02em}
.weight{margin-top:7px;font-size:clamp(54px,14vw,76px);font-weight:760;line-height:.92;letter-spacing:-.075em;white-space:nowrap}
.weight span{margin-left:5px;color:var(--muted);font-size:19px;font-weight:550;letter-spacing:0}
.goal-line{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:16px}
.goal-value{font-size:20px;font-weight:720;letter-spacing:-.025em}
.goal-pill{padding:6px 9px;border:1px solid var(--stroke);border-radius:999px;background:var(--soft);color:var(--muted);font-size:11px}
.hero-sticker{
  position:absolute;z-index:1;top:-1px;right:-2px;width:clamp(178px,43vw,226px);max-height:300px;
  object-fit:contain;object-position:top right;filter:drop-shadow(0 18px 22px rgba(0,0,0,.38));
  pointer-events:none;user-select:none
}
.hero-bottom{position:relative;z-index:3}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.metric{min-width:0;padding:14px 15px;border:1px solid var(--stroke);border-radius:20px;background:rgba(255,255,255,.055);backdrop-filter:blur(18px)}
.metric small{display:block;margin-bottom:6px;color:var(--muted);font-size:11px}
.metric b{display:block;overflow:hidden;font-size:18px;letter-spacing:-.025em;text-overflow:ellipsis;white-space:nowrap}
.journal-preview{min-height:42px;margin-top:17px;color:#ddddda;font-size:14px;line-height:1.5;white-space:pre-wrap}
.primary,.secondary{width:100%;border-radius:20px;padding:16px 18px;font-weight:720;transition:transform .15s ease,opacity .15s ease}
.primary:active,.secondary:active{transform:scale(.985)}
.primary{border:1px solid rgba(255,255,255,.82);margin-top:12px;background:#fff;color:#070707}
.secondary{border:1px solid var(--stroke);background:var(--soft);color:var(--text)}
.progress-card{overflow:hidden;border-radius:32px;padding:20px}
.progress-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.progress-head p{margin-top:5px;font-size:12px}
.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:174px;padding:4px;border:1px solid var(--stroke);border-radius:14px;background:rgba(0,0,0,.24)}
.periods button{border:0;border-radius:10px;padding:8px 5px;background:transparent;color:var(--muted);font-size:12px;font-weight:700}
.periods button.active{background:#fff;color:#070707}
.chart-shell{margin-top:22px}.chart{display:block;width:100%;height:230px;overflow:visible}
.chart-grid{stroke:rgba(255,255,255,.08);stroke-width:1}.chart-label{fill:var(--muted);font-size:10px}
.chart-empty{display:grid;height:230px;place-items:center;color:var(--muted);text-align:center;font-size:13px}
.chart-range{display:flex;justify-content:space-between;margin-top:2px;color:var(--muted);font-size:11px}
.summary-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.summary{min-height:94px;border-radius:23px;padding:16px}
.summary small{display:block;color:var(--muted);font-size:11px}
.summary b{display:block;margin-top:8px;font-size:21px;letter-spacing:-.035em}
.history-list{display:grid;gap:10px}
.history-item{
  width:100%;border:1px solid var(--stroke);border-radius:25px;padding:18px;
  background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.02)),var(--panel);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09);color:var(--text);text-align:left;
  backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)
}
.history-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.history-date{font-weight:720;letter-spacing:-.02em}.history-edit{color:var(--muted);font-size:11px}
.history-weight{margin-top:4px;font-size:24px;font-weight:750;letter-spacing:-.04em}
.history-data{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.history-data span{padding:6px 9px;border:1px solid var(--stroke);border-radius:999px;background:var(--soft);color:var(--muted);font-size:11px}
.history-note{margin-top:13px;color:#d2d2cf;font-size:13px;line-height:1.48;white-space:pre-wrap}
.empty-state{padding:44px 20px;border:1px dashed var(--stroke);border-radius:26px;color:var(--muted);text-align:center}
nav{
  position:fixed;z-index:20;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);width:min(430px,calc(100% - 28px));min-height:67px;
  padding:7px;transform:translateX(-50%);border:1px solid var(--strong);border-radius:28px;
  background:rgba(24,24,24,.72);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 16px 50px rgba(0,0,0,.52);
  backdrop-filter:blur(34px) saturate(135%);-webkit-backdrop-filter:blur(34px) saturate(135%)
}
nav button{border:0;border-radius:21px;padding:6px 4px;background:transparent;color:#777774;font-size:10px;font-weight:650}
nav button .nav-icon{display:block;height:22px;margin-bottom:2px;font-size:19px;line-height:22px}
nav button.active{background:rgba(255,255,255,.105);color:#fff}
dialog{
  width:min(620px,calc(100% - 16px));max-height:min(92vh,850px);overflow:auto;border:1px solid var(--strong);
  border-radius:34px;padding:0;background:rgba(19,19,19,.9);box-shadow:0 40px 110px rgba(0,0,0,.68);
  color:var(--text);backdrop-filter:blur(38px) saturate(130%);-webkit-backdrop-filter:blur(38px) saturate(130%)
}
dialog::backdrop{background:rgba(0,0,0,.68);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.sheet{padding:22px}.sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:23px}
.sheet-kicker{margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.17em}
.close{width:36px;height:36px;border:1px solid var(--stroke);border-radius:50%;background:var(--soft);color:var(--text);font-size:21px;line-height:1}
label{display:block;margin-bottom:14px;color:var(--muted);font-size:12px}
input,textarea{display:block;width:100%;border:1px solid var(--stroke);border-radius:18px;margin-top:7px;padding:15px;outline:none;background:rgba(255,255,255,.06);color:var(--text);font-size:16px}
input:focus,textarea:focus{border-color:rgba(255,255,255,.48);background:rgba(255,255,255,.085)}
textarea{min-height:230px;resize:vertical;line-height:1.5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.full{grid-column:1/-1}.optional{color:var(--dim);font-weight:500}
.auth{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 0%,rgba(255,255,255,.12),transparent 30rem),#050505}
.auth.hidden{display:none}.auth-card{width:min(430px,100%);border-radius:34px;padding:25px}
.auth-card h2{margin:11px 0 7px;font-size:31px}.auth-card p{margin-bottom:22px;line-height:1.45}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.auth-actions .primary{margin:0}
.auth-msg{min-height:18px;margin-top:13px;color:var(--muted);font-size:12px;line-height:1.45}
@media(max-width:470px){
  .hero{min-height:392px;padding:21px}.hero-main{grid-template-columns:minmax(0,1fr) 144px;min-height:221px}
  .hero-sticker{right:-11px;width:180px}.weight{font-size:57px}
  .progress-head{align-items:stretch;flex-direction:column}.periods{width:100%}
}
@media(max-width:360px){
  .app{padding-left:12px;padding-right:12px}.hero-main{grid-template-columns:minmax(0,1fr) 116px}
  .hero-sticker{width:158px}.weight{font-size:51px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}
}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card glass">
    <div class="brand">SOLO</div>
    <h2>Вход</h2>
    <p class="muted">Записи синхронизируются с твоим личным облаком.</p>
    <label>Email<input id="email" type="email" autocomplete="email"></label>
    <label>Пароль<input id="password" type="password" autocomplete="current-password"></label>
    <div class="auth-actions">
      <button class="primary" type="button" onclick="login()">Войти</button>
      <button class="secondary" type="button" onclick="signup()">Регистрация</button>
    </div>
    <div id="authMsg" class="auth-msg" aria-live="polite"></div>
  </div>
</div>

<div class="app">
  <header class="top">
    <div><div class="brand">SOLO</div><h1 id="pageTitle">Сегодня</h1></div>

<script>
const SUPABASE_URL = 'https://uxogvikvlqemyletowfc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Osjd2rvBr2l3ogBLndVzhQ_vD3kcnfj';
const sb = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const GOAL_WEIGHT = 75;
const PREVIEW_MODE =
  (location.hostname === 'localhost' || location.hostname === '127.0.0.1') &&
  new URLSearchParams(location.search).get('preview') === '1';

let user = null;
let logs = [];
let selectedPeriod = 14;
const $ = id => document.getElementById(id);

function localDate(value){
  const d = value ? new Date(value) : new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}

function dateFromIso(date){return new Date(date + 'T12:00:00')}

function formatDate(date){
  const parsed = dateFromIso(date);
  return parsed.toLocaleDateString('ru-RU',{
    day:'numeric',month:'long',
    year:parsed.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'
  });
}

function compactDate(date){
  return dateFromIso(date).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}

function escapeHtml(text){
  const element = document.createElement('div');
  element.textContent = text || '';
  return element.innerHTML;
}

function isPresent(value){return Number.isFinite(value) && value > 0}
function parseOptionalNumber(value){
  const clean = String(value || '').trim();
  return clean === '' ? 0 : Number(clean);
}

function cacheKey(){return 'solo_v5_cache:' + (user ? user.id : 'preview')}
function cloud(text,ok){
  $('cloudText').textContent = text;
  $('cloudDot').classList.toggle('ok',Boolean(ok));
}

function normalize(row){
  return {
    date:row.log_date,
    weight:row.weight === null ? null : Number(row.weight),
    calories:row.calories === null ? 0 : Number(row.calories),
    protein:row.protein === null ? 0 : Number(row.protein),
    journal:row.note || ''
  };
}

function findDate(date){return logs.find(item => item.date === date)}
function latestWeight(){
  const item = [...logs].reverse().find(entry => Number.isFinite(entry.weight));
  return item ? item.weight : null;
}

function loadCache(){
  try{logs = JSON.parse(localStorage.getItem(cacheKey()) || '[]')}
  catch(error){console.warn('Cache unavailable',error);logs=[]}
}
function saveCache(){localStorage.setItem(cacheKey(),JSON.stringify(logs))}

async function loadCloud(){
  if(!user || PREVIEW_MODE) return;
  cloud('Синхронизация',false);
  const response = await sb.from('daily_logs')
    .select('log_date,weight,calories,protein,note')
    .eq('user_id',user.id)
    .order('log_date',{ascending:true});

  if(response.error){
    console.error(response.error);
    loadCache();
    cloud(logs.length ? 'Оффлайн-копия' : 'Ошибка',false);
    render();
    return;
  }

  logs = (response.data || []).map(normalize);
  saveCache();
  cloud('Синхронизировано',true);
  render();
}

async function saveDay(log){
  if(PREVIEW_MODE){
    const index = logs.findIndex(item => item.date === log.date);
    if(index >= 0) logs[index] = log; else logs.push(log);
    logs.sort((a,b) => a.date.localeCompare(b.date));
    saveCache();cloud('Локальный просмотр',true);render();
    return true;
  }
  if(!user) return false;

  cloud('Сохраняю',false);
  $('saveButton').disabled = true;
  $('saveButton').textContent = 'Сохраняю…';

  const payload = {
    user_id:user.id,log_date:log.date,weight:log.weight,
    calories:log.calories,protein:log.protein,note:log.journal
  };
  const response = await sb.from('daily_logs')
    .upsert(payload,{onConflict:'user_id,log_date'});

  $('saveButton').disabled = false;
  $('saveButton').textContent = 'Сохранить';

  if(response.error){
    console.error(response.error);
    cloud('Ошибка сохранения',false);
    alert('Не удалось сохранить запись в облако.');
    return false;
  }
  await loadCloud();
  return true;
}

function renderToday(){
  const today = findDate(localDate());
  const weight = latestWeight();

  $('mainWeight').innerHTML = Number.isFinite(weight)
    ? weight.toFixed(1) + ' <span>кг</span>'
    : '— <span>кг</span>';

  if(Number.isFinite(weight)){
    const difference = weight - GOAL_WEIGHT;
    $('toGoal').textContent = difference > 0
      ? difference.toFixed(1) + ' кг до цели'
      : 'Цель взята';
  }else{
    $('toGoal').textContent = '—';
  }

  $('todayCalories').textContent = today && isPresent(today.calories)
    ? Math.round(today.calories) + ' ккал' : 'Пропуск';
  $('todayProtein').textContent = today && isPresent(today.protein)
    ? Math.round(today.protein) + ' г' : 'Пропуск';

  if(!today) $('todayJournal').textContent = 'Сегодня ещё нет записи.';
  else if(today.journal.trim()) $('todayJournal').textContent = today.journal;
  else $('todayJournal').textContent = 'Запись сохранена';

  $('todayAction').textContent = today ? 'Изменить запись' : 'Записать день';
}

function logsForPeriod(days){
  const end = dateFromIso(localDate());
  const start = new Date(end);
  start.setDate(start.getDate()-days+1);
  return logs.filter(item => {
    const date = dateFromIso(item.date);
    return date >= start && date <= end;
  });
}

function average(items,key){
  const values = items.map(item => item[key]).filter(value => isPresent(value));
  return values.length ? values.reduce((sum,value) => sum+value,0)/values.length : null;
}

function setPeriod(days,button){
  selectedPeriod = days;
  document.querySelectorAll('.periods button').forEach(item => item.classList.remove('active'));
  button.classList.add('active');
  renderProgress();
}

function renderProgress(){
  const period = logsForPeriod(selectedPeriod);
  const weighted = period.filter(item => isPresent(item.weight));
  const avgWeightValue = average(period,'weight');
  const avgCaloriesValue = average(period,'calories');
  const avgProteinValue = average(period,'protein');

  $('progressSubtitle').textContent = 'Последние ' + selectedPeriod + ' дней';
  drawChart(weighted);
  $('avgWeight').textContent = avgWeightValue === null ? '—' : avgWeightValue.toFixed(1) + ' кг';

  if(weighted.length >= 2){
    const delta = weighted[weighted.length-1].weight-weighted[0].weight;
    $('weightDelta').textContent = (delta > 0 ? '+' : '') + delta.toFixed(1) + ' кг';
  }else{
    $('weightDelta').textContent = '—';
  }

  $('avgCalories').textContent = avgCaloriesValue === null
    ? 'Пропуск' : Math.round(avgCaloriesValue) + ' ккал';
  $('avgProtein').textContent = avgProteinValue === null
    ? 'Пропуск' : Math.round(avgProteinValue) + ' г';
}

function drawChart(data){
  if(!data.length){
    $('chartArea').innerHTML = '<div class="chart-empty">Добавь вес — здесь появится график.</div>';
    return;
  }

  const W=560,H=230,left=38,right=12,top=18,bottom=24;
  const values=data.map(item=>item.weight);
  let min=Math.min.apply(null,values),max=Math.max.apply(null,values);

  if(min===max){min-=.5;max+=.5}
  else{const padding=Math.max((max-min)*.22,.35);min-=padding;max+=padding}

  const points=data.map((item,index)=>{
    const x=data.length===1?(left+W-right)/2:left+((W-left-right)*index/(data.length-1));
    const y=H-bottom-((item.weight-min)/(max-min))*(H-top-bottom);
    return {x:x,y:y};
  });

  const poly=points.map(point=>point.x.toFixed(1)+','+point.y.toFixed(1)).join(' ');
  const gridValues=[max,(max+min)/2,min];
  const grids=gridValues.map((value,index)=>{
    const y=top+(H-top-bottom)*index/2;
    return '<line class="chart-grid" x1="'+left+'" x2="'+(W-right)+'" y1="'+y+'" y2="'+y+'"></line>'+
      '<text class="chart-label" x="0" y="'+(y+3)+'">'+value.toFixed(1)+'</text>';
  }).join('');
  const dots=points.map(point=>
    '<circle cx="'+point.x.toFixed(1)+'" cy="'+point.y.toFixed(1)+'" r="4.5" fill="#fff" stroke="#0a0a0a" stroke-width="2"></circle>'
  ).join('');
  const areaPoints=points[0].x.toFixed(1)+','+(H-bottom)+' '+poly+' '+
    points[points.length-1].x.toFixed(1)+','+(H-bottom);
  const line=data.length>1
    ? '<polyline points="'+poly+'" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></polyline>'
    : '';

  $('chartArea').innerHTML =
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График веса">'+
      '<defs><linearGradient id="weightFill" x1="0" y1="0" x2="0" y2="1">'+
      '<stop offset="0%" stop-color="#fff" stop-opacity=".20"></stop>'+
      '<stop offset="100%" stop-color="#fff" stop-opacity="0"></stop></linearGradient></defs>'+
      grids+'<polygon points="'+areaPoints+'" fill="url(#weightFill)"></polygon>'+line+dots+
    '</svg><div class="chart-range"><span>'+compactDate(data[0].date)+'</span><span>'+
      compactDate(data[data.length-1].date)+'</span></div>';
}

function renderHistory(){
  if(!logs.length){
    $('history').innerHTML='<div class="empty-state">Записей пока нет.</div>';
    return;
  }

  $('history').innerHTML=[...logs].reverse().map(item=>{
    const calories=isPresent(item.calories)?Math.round(item.calories)+' ккал':'Калории · пропуск';
    const protein=isPresent(item.protein)?Math.round(item.protein)+' г белка':'Белок · пропуск';
    const note=item.journal.trim()?escapeHtml(item.journal):'Запись сохранена без текста';
    const weight=isPresent(item.weight)?item.weight.toFixed(1)+' кг':'Вес не указан';

    return '<button class="history-item" type="button" data-date="'+escapeHtml(item.date)+'">'+
      '<div class="history-top"><div><div class="history-date">'+formatDate(item.date)+'</div>'+
      '<div class="history-weight">'+weight+'</div></div><span class="history-edit">Изменить ›</span></div>'+
      '<div class="history-data"><span>'+calories+'</span><span>'+protein+'</span></div>'+
      '<div class="history-note">'+note+'</div></button>';
  }).join('');

  document.querySelectorAll('.history-item').forEach(button=>{
    button.addEventListener('click',()=>editDay(button.dataset.date));
  });
}

function render(){renderToday();renderProgress();renderHistory()}

function editDay(date){
  const targetDate=date||localDate();
  const log=findDate(targetDate);
  $('logDate').value=targetDate;
  $('weight').value=log&&Number.isFinite(log.weight)?log.weight:'';
  $('calories').value=log&&isPresent(log.calories)?log.calories:'';
  $('protein').value=log&&isPresent(log.protein)?log.protein:'';
  $('journal').value=log?log.journal:'';
  $('editorTitle').textContent=log?'Изменить день':'Новый день';
  $('editor').showModal();
}

$('form').addEventListener('submit',async event=>{
  event.preventDefault();
  const log={
    date:$('logDate').value,
    weight:Number($('weight').value),
    calories:parseOptionalNumber($('calories').value),
    protein:parseOptionalNumber($('protein').value),
    journal:$('journal').value.trim()
  };
  if(await saveDay(log)) $('editor').close();
});

function showScreen(name,button){
  const map={today:['todayScreen','Сегодня'],progress:['progressScreen','Прогресс'],history:['historyScreen','История']};
  document.querySelectorAll('.screen').forEach(screen=>screen.classList.remove('active'));
  $(map[name][0]).classList.add('active');
  $('pageTitle').textContent=map[name][1];
  document.querySelectorAll('nav button').forEach(item=>item.classList.remove('active'));
  button.classList.add('active');
  if(name==='progress') renderProgress();
  if(name==='history') renderHistory();
}

function authMessage(text,isError){
  $('authMsg').textContent=text;
  $('authMsg').style.color=isError?'var(--danger)':'var(--muted)';
}

async function login(){
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||!password){authMessage('Укажи email и пароль.',true);return}
  authMessage('Вхожу…',false);
  const response=await sb.auth.signInWithPassword({email:email,password:password});
  if(response.error){authMessage(response.error.message,true);return}
  user=response.data.user;
  $('auth').classList.add('hidden');
  loadCache();render();await loadCloud();
}

async function signup(){
  const email=$('email').value.trim();
  const password=$('password').value;
  if(!email||password.length<6){authMessage('Укажи email и пароль минимум из 6 символов.',true);return}
  authMessage('Создаю аккаунт…',false);
  const response=await sb.auth.signUp({email:email,password:password});
  if(response.error){authMessage(response.error.message,true);return}
  if(response.data.session){
    user=response.data.user;$('auth').classList.add('hidden');
    loadCache();render();await loadCloud();
  }else{
    authMessage('Подтверди email через письмо и затем войди.',false);
  }
}

async function logout(){
  if(PREVIEW_MODE){location.href=location.pathname;return}
  await sb.auth.signOut();
  user=null;logs=[];
  $('auth').classList.remove('hidden');
  cloud('Нет входа',false);render();
}

function buildPreviewLogs(){
  const values=[
    {days:-13,weight:95.8,calories:2350,protein:120,journal:'Вернулся к режиму. Вечером была прогулка.'},
    {days:-11,weight:95.4,calories:0,protein:0,journal:'Калории не считал. Спал лучше.'},
    {days:-8,weight:95.1,calories:2200,protein:132,journal:'Тренировка и обычный рабочий день.'},
    {days:-5,weight:94.8,calories:2100,protein:128,journal:'Ужин поздно, но без переедания.'},
    {days:-2,weight:94.5,calories:0,protein:118,journal:'Записал еду текстом, калории пропустил.'},
    {days:0,weight:94.3,calories:0,protein:0,journal:''}
  ];
  return values.map(item=>{
    const date=new Date();date.setDate(date.getDate()+item.days);
    return {date:localDate(date),weight:item.weight,calories:item.calories,protein:item.protein,journal:item.journal};
  });
}

async function init(){
  if(PREVIEW_MODE){
    user={id:'preview'};logs=buildPreviewLogs();
    $('auth').classList.add('hidden');cloud('Локальный просмотр',true);render();return;
  }
  const response=await sb.auth.getSession();
  const session=response.data.session;
  if(session&&session.user){
    user=session.user;$('auth').classList.add('hidden');
    loadCache();render();await loadCloud();
  }else{
    cloud('Нет входа',false);render();
  }
}
init();
</script>
